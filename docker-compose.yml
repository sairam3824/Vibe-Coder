services:
  api:
    image: python:3.12-slim
    working_dir: /workspace
    command: /bin/sh -c "python -m pip install -e . && python -m uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    ports:
      - "8000:8000"

  web:
    image: node:20-bookworm-slim
    working_dir: /workspace/apps/web
    command: /bin/sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./:/workspace
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      - api
